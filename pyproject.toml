[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-llm"
version = "0.1.0"
description = "AI Security Auditing & Defense Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "regex>=2024.0.0",
    "jsonschema>=4.21.0",
    "pydantic>=2.6.0"
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
